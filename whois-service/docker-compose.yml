# One image, two roles. Nodes only run: docker compose pull && docker compose up -d
x-image: &image gitea.internal.grantek.com/platform/whois-service:${WHOIS_IMAGE_TAG:-latest}

services:
  whois-service:
    image: *image
    container_name: internal-whois-api
    restart: unless-stopped
    command: >-
      uvicorn main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips *
    networks: [internal-platform, proxy]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      WHOIS_API_KEY: ${AKV_WHOIS_API_KEY:?set AKV_WHOIS_API_KEY}
      ADMIN_ALLOWED_GROUPS: ${ADMIN_ALLOWED_GROUPS:?set ADMIN_ALLOWED_GROUPS}
      ADMIN_PROXY_SHARED_SECRET: ${ADMIN_PROXY_SHARED_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.whois-app.loadbalancer.server.port=8000

      - traefik.http.routers.whois.rule=Host(`whois.gt-app-dev-001.grantek.internal`) && PathPrefix(`/whois`)
      - traefik.http.routers.whois.entrypoints=websecure
      - traefik.http.routers.whois.tls=true
      - traefik.http.routers.whois.service=whois-app

      - traefik.http.routers.whois-admin.rule=Host(`whois.gt-app-dev-001.grantek.internal`) && PathPrefix(`/admin`)
      - traefik.http.routers.whois-admin.entrypoints=websecure
      - traefik.http.routers.whois-admin.tls=true
      - traefik.http.routers.whois-admin.service=whois-app
      - traefik.http.routers.whois-admin.middlewares=authentik-auth@docker,whois-proxy-secret@docker
      - traefik.http.middlewares.whois-proxy-secret.headers.customrequestheaders.X-Proxy-Secret=${ADMIN_PROXY_SHARED_SECRET:-}

  whois-worker:
    image: *image
    container_name: internal-whois-worker
    restart: unless-stopped
    command: python sync_worker.py
    stop_grace_period: 30s
    networks: [internal-platform]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:?set AZURE_TENANT_ID}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?set AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?set AZURE_CLIENT_SECRET}
      SYNC_INTERVAL_SECONDS: 3600
    healthcheck:
      test: ["CMD", "python", "sync_worker.py", "--check"]
      interval: 5m
      timeout: 10s
      start_period: 10m

networks:
  internal-platform:
    external: true
  proxy:
    external: true
